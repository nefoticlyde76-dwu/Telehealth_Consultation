name: Deploy to InfinityFree

on:
  push:
    branches:
      - master

concurrency:
  group: production-infinityfree
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, fileinfo, gd, json, mbstring, openssl, pdo, pdo_mysql
          coverage: none
          ini-values: display_errors=Off

      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Confirm vendor autoloader exists
        run: test -f vendor/autoload.php

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: htdocs/
          local-dir: ./
          timeout: 600000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.local
            **/.rnd
            **/logs/*.log
            **/tmp/sessions/**
            **/tmp/mail/**
            **/*.zip
            **/bin/test_*
            **/bin/week9_*
            **/bin/apply_migration_*
            **/WEEK*_REPORT.md
