name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP 8.2
    runs-on: ubuntu-latest

    # composer.json allows PHP >=8.0. PHPUnit 11.5 in require-dev needs >=8.2,
    # which also matches the local XAMPP runtime.
    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_URL: http://localhost
      APP_TIMEZONE: Pacific/Port_Moresby
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: telehealth_db
      DB_USER: root
      DB_PASS: root
      SESSION_NAME: TELEHEALTH_SESSION
      SESSION_LIFETIME: "7200"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: telehealth_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, fileinfo, gd, mbstring, openssl, pdo, pdo_mysql
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit

      - name: PHP syntax check
        run: find app -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Import database schema
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq default-mysql-client
          mysql --host=127.0.0.1 --port=3306 --user=root --password=root < database/schema.sql

      - name: Run PHPUnit
        run: composer test
